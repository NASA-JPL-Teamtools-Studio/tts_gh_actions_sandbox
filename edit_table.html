<!DOCTYPE html>
<html>
<head>
    <title>Table CMS Editor</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <style>
        body { font-family: -apple-system, sans-serif; padding: 30px; background: #fafbfc; color: #24292f; }
        .wrapper { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border: 1px solid #d0d7de; border-radius: 8px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; background: #f6f8fa; padding: 15px; border-radius: 6px; }
        input { padding: 8px; border: 1px solid #d0d7de; border-radius: 4px; flex-grow: 1; }
        button { padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(27,31,36,0.15); cursor: pointer; font-weight: 600; }
        .btn-primary { background: #2da44f; color: white; }
        .btn-secondary { background: #f6f8fa; color: #24292f; }
        #status { margin-top: 15px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Table Editor (demo_table.md)</h2>
    
    <div class="toolbar">
        <input type="password" id="pat" placeholder="GitHub PAT">
        <button class="btn-secondary" onclick="loadData()">📂 Load Table</button>
        <button class="btn-primary" onclick="saveData()">🚀 Submit Changes</button>
    </div>

    <div id="editor"></div>
    <div id="status">Ready...</div>
</div>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
    // --- SET THESE ---
    const OWNER = 'YOUR_USERNAME';
    const REPO = 'YOUR_REPO_NAME';
    const FILE = 'demo_table.md';

    const editor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '500px',
        initialEditType: 'wysiwyg',
        previewStyle: 'vertical'
    });

    // Remember token
    document.getElementById('pat').value = localStorage.getItem('gh_token') || '';

    async function loadData() {
        const token = document.getElementById('pat').value;
        const status = document.getElementById('status');
        localStorage.setItem('gh_token', token);

        status.innerText = "🔍 Fetching demo_table.md...";
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}?ref=gh-pages`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error("Could not find file. Make sure it exists in gh-pages branch.");
            
            const json = await res.json();
            // Decode Base64 content
            const content = decodeURIComponent(escape(atob(json.content)));
            editor.setMarkdown(content);
            status.innerText = "✅ Table loaded!";
        } catch (e) {
            status.innerText = "❌ Error: " + e.message;
        }
    }

    async function saveData() {
        const token = document.getElementById('pat').value;
        const status = document.getElementById('status');
        const content = editor.getMarkdown();

        status.innerText = "📡 Triggering Action...";
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    event_type: 'save_table',
                    client_payload: { content: content }
                })
            });

            if (res.status === 204) {
                status.innerText = "🚀 Success! Action is rewriting the file. Check GitHub in 30 seconds.";
            } else {
                status.innerText = "❌ Failed. Check token permissions.";
            }
        } catch (e) {
            status.innerText = "❌ Error: " + e.message;
        }
    }
</script>
</body>
</html>
